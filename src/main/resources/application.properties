# ============================================================
#  Camel File Processor - Application Configuration
# ============================================================

# ----- Application -----
spring.application.name=camel-file-processor
spring.main.web-application-type=none

# ----- Apache Camel -----
camel.springboot.main-run-controller=true

# ----- File Processor Properties -----
file.processor.sourceDir=./data/input
file.processor.destination-directory=./data/output
file.processor.success-directory=./data/processed
file.processor.error-directory=./data/error
file.processor.polling-interval=5000
file.processor.content-header=# ---- Processed by Camel File Processor ----
file.processor.content-footer=# ---- End of processed content ----
